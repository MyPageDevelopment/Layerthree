events {
    worker_connections 1024;
}

http {
    upstream inventory_backend {
        server inventory-backend:3001;
    }

    upstream inventory_frontend {
        server inventory-frontend:3000;
    }

    upstream calendar_backend {
        server calendar-backend:3003;
    }

    upstream calendar_frontend {
        server calendar-frontend:3000;
    }

    # Map para detectar solicitudes OPTIONS
    map $request_method $is_options {
        default 0;
        OPTIONS 1;
    }

    # CORS: Lista blanca de orígenes permitidos (SEGURIDAD MEJORADA)
    map $http_origin $cors_origin {
        default "";
        "~^https?://172\.16\.11\.174(:[0-9]+)?$" $http_origin;
        "~^https?://localhost(:[0-9]+)?$" $http_origin;
        "~^https?://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
    }

    # Configuración de logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Timeouts para microservicios
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Server principal
    server {
        listen 80;
        server_name localhost;
        
        # Deshabilitar auto-redirect de trailing slash
        merge_slashes off;
        port_in_redirect off;

        # Aumentar tamaño máximo de body para uploads
        client_max_body_size 100M;

        # Tipos MIME
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        # Página principal - Redirect a login o dashboard
        location = / {
            root /usr/share/nginx/html;
            try_files /redirect.html =404;
        }

        # Servicio de Autenticación
        location /auth/ {
            # Manejar preflight requests (OPTIONS)
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Requested-With' always;
                add_header Access-Control-Allow-Credentials 'true' always;
                add_header Access-Control-Max-Age 86400;
                add_header Content-Type 'text/plain; charset=utf-8';
                add_header Content-Length 0;
                return 204;
            }

            proxy_pass http://auth_backend:3002/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS Headers (restrictivo con lista blanca)
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Requested-With' always;
            add_header Access-Control-Allow-Credentials 'true' always;
            
            # Security Headers
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }

        # API de Auth (login, register, users) - DEBE IR ANTES de estáticos
        location /api/auth/ {
            # Manejar preflight requests (OPTIONS)
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Requested-With' always;
                add_header Access-Control-Allow-Credentials 'true' always;
                add_header Access-Control-Max-Age 86400;
                return 204;
            }

            rewrite ^/api/auth/(.*)$ /$1 break;
            
            proxy_pass http://auth_backend:3002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_request_headers on;
            
            # CORS Headers (restrictivo con lista blanca)
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Requested-With' always;
            add_header Access-Control-Allow-Credentials 'true' always;
            
            # Security Headers
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Frontend del Inventario (incluye _next/ y todas las rutas) - DEBE IR ANTES de la regla de estáticos
        location /inventory {
            proxy_pass http://inventory_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Next.js Hot Reload
            proxy_buffering off;
        }

        # Frontend de Proyectos (Calendario) - DEBE IR ANTES de regex estáticos
        location /projects {
            rewrite ^/projects(/.*)$ $1 break;
            rewrite ^/projects$ / break;
            
            proxy_pass http://calendar_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_buffering off;
        }

        # Archivos HTML del portal (login, dashboard, etc.)
        location ~* ^/(login|dashboard)\.html$ {
            root /usr/share/nginx/html;
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Recursos estáticos del portal (SOLO raíz, NO /inventory ni /projects)
        location ~* ^/[^/]+\.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Manejar preflight OPTIONS para inventario
        location ~ ^/api/inventory/.* {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Requested-With' always;
                add_header Access-Control-Allow-Credentials 'true' always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                return 204;
            }

            rewrite ^/api/inventory/(.*) /$1 break;
            proxy_pass http://inventory_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Ocultar headers CORS del backend
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            
            # Añadir headers CORS restrictivos
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Requested-With' always;
            add_header Access-Control-Allow-Credentials 'true' always;
            
            # Security Headers
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }

        # Manejar preflight OPTIONS para calendario
        location ~ ^/api/calendar/.* {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Requested-With' always;
                add_header Access-Control-Allow-Credentials 'true' always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                return 204;
            }
            
            rewrite ^/api/calendar/(.*) /$1 break;
            proxy_pass http://calendar_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Ocultar headers CORS del backend
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            
            # Añadir headers CORS restrictivos
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Requested-With' always;
            add_header Access-Control-Allow-Credentials 'true' always;
            
            # Security Headers
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Health check del gateway
        location /health {
            return 200 "Gateway OK\n";
            add_header Content-Type text/plain;
        }

        # Placeholder para futuros microservicios
        # location /api/payments/ {
        #     rewrite ^/api/payments/(.*) /$1 break;
        #     proxy_pass http://payments-backend;
        # }
        
        # location /api/hr/ {
        #     rewrite ^/api/hr/(.*) /$1 break;
        #     proxy_pass http://hr-backend;
        # }
    }
}
