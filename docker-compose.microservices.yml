# ====================================================================
# DOCKER COMPOSE - ARQUITECTURA DE MICROSERVICIOS
# Sistema de Intranet Layerthree
# ====================================================================

version: '3.8'

# ====================================================================
# SECRETS - Gestión segura de credenciales sensibles
# ====================================================================
secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  jwt_refresh_secret:
    file: ./secrets/jwt_refresh_secret.txt
  smtp_password:
    file: ./secrets/smtp_password.txt

networks:
  intranet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  mysql_data:
    driver: local
  mysql_inventory_data:
    driver: local
  redis_data:
    driver: local
  calendar_uploads:
    driver: local

# ====================================================================
# SERVICIOS
# ====================================================================

services:
  # ------------------------------------------------------------------
  # INFRAESTRUCTURA - Base de Datos MySQL Compartida
  # ------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: intranet_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: intranet_db
    # Puerto expuesto solo en localhost para debugging
    # Servicios internos usan la red 'intranet'
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/mysql/init:/docker-entrypoint-initdb.d
    networks:
      intranet:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ------------------------------------------------------------------
  # INFRAESTRUCTURA - Redis (Message Broker & Cache)
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: intranet_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_password}
    ports:
      - "127.0.0.1:6379:6379"  # Solo accesible desde localhost
    volumes:
      - redis_data:/data
    networks:
      intranet:
        ipv4_address: 172.20.0.11
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ------------------------------------------------------------------
  # MICROSERVICIO 0 - AUTENTICACIÓN GLOBAL - Backend
  # ------------------------------------------------------------------
  auth-backend:
    build:
      context: ./services/auth/backend
      dockerfile: Dockerfile
    container_name: auth_backend
    restart: unless-stopped
    secrets:
      - jwt_secret
      - jwt_refresh_secret
    environment:
      DATABASE_URL: "mysql://root:${MYSQL_ROOT_PASSWORD:-rootpassword}@mysql:3306/inventory_db"
      # JWT Secret se lee desde /run/secrets/jwt_secret en producción
      # Fallback para desarrollo: ${JWT_SECRET}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_REFRESH_SECRET_FILE: /run/secrets/jwt_refresh_secret
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRATION: 7d
      JWT_REFRESH_EXPIRATION: 30d
      PORT: 3002
      NODE_ENV: ${NODE_ENV:-production}
    command: >
      sh -c "npx prisma migrate deploy &&
             npm run start:prod"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3002:3002"
    networks:
      intranet:
        ipv4_address: 172.20.0.61
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --quiet --tries=1 -O /dev/null http://localhost:3002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ------------------------------------------------------------------
  # MICROSERVICIO 1 - INVENTARIO (BODEGA) - Backend
  # ------------------------------------------------------------------
  inventory-backend:
    build:
      context: ./services/inventory/backend
      dockerfile: Dockerfile
    container_name: inventory_backend
    restart: unless-stopped
    secrets:
      - jwt_secret
      - jwt_refresh_secret
    environment:
      # Base de datos
      DATABASE_URL: "mysql://root:${MYSQL_ROOT_PASSWORD:-rootpassword}@mysql:3306/inventory_db"
      
      # JWT (usar el mismo secreto que auth-backend)
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_REFRESH_SECRET_FILE: /run/secrets/jwt_refresh_secret
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      
      # Servicio
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-production}
      SERVICE_NAME: inventory
      
      # CORS
      FRONTEND_URL: "*"
      
    command: >
      sh -c "npx prisma migrate deploy &&
             (npx prisma db seed || echo 'Seed already executed or failed, continuing...') &&
             npm run start:prod"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      intranet:
        ipv4_address: 172.20.0.21
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --quiet --tries=1 -O /dev/null http://127.0.0.1:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ------------------------------------------------------------------
  # MICROSERVICIO 1 - INVENTARIO (BODEGA) - Frontend
  # ------------------------------------------------------------------
  inventory-frontend:
    build:
      context: ./services/inventory/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost/api/inventory
    container_name: inventory_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/inventory}
    depends_on:
      - inventory-backend
    networks:
      intranet:
        ipv4_address: 172.20.0.22
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --quiet --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ------------------------------------------------------------------
  # API GATEWAY - Nginx
  # ------------------------------------------------------------------
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: api_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - inventory-backend
      - inventory-frontend
      - calendar-backend
      - calendar-frontend
    networks:
      intranet:
        ipv4_address: 172.20.0.2
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ------------------------------------------------------------------
  # MICROSERVICIO 2 - CALENDARIO (Gestión de Tiempos)
  # ------------------------------------------------------------------
  calendar-backend:
    build:
      context: ./services/calendar/backend
      dockerfile: Dockerfile
    container_name: calendar_backend
    restart: unless-stopped
    ports:
      - "3003:3003"
    volumes:
      - calendar_uploads:/app/uploads
    secrets:
      - jwt_secret
      - jwt_refresh_secret
      - smtp_password
    environment:
      # Base de datos
      DATABASE_URL: "mysql://root:${MYSQL_ROOT_PASSWORD:-rootpassword}@mysql:3306/calendar_db"

      # JWT (si se implementa autenticación)
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_REFRESH_SECRET_FILE: /run/secrets/jwt_refresh_secret
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      
      # Servicio
      PORT: 3003
      NODE_ENV: ${NODE_ENV:-production}
      SERVICE_NAME: calendar
      
      # CORS - DESHABILITADO (nginx gateway maneja CORS)
      # CORS_ORIGIN: "*"
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      
      # Email Service (SMTP) - Password desde secret
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-mypage.development@gmail.com}
      SMTP_PASS_FILE: /run/secrets/smtp_password
      SMTP_PASS: ${SMTP_PASS:-fallback_only_for_dev}
      EMAIL_FROM: ${EMAIL_FROM:-Sistema Bodega <mypage.development@gmail.com>}
    
    command: >
      sh -c "npx prisma migrate deploy &&
             npm run start:prod"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      intranet:
          ipv4_address: 172.20.0.51
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --quiet --tries=1 -O /dev/null http://localhost:3003/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ------------------------------------------------------------------
  # MICROSERVICIO 2 - CALENDARIO (Frontend)
  # ------------------------------------------------------------------
  calendar-frontend:
    build:
      context: ./services/calendar/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_CALENDAR_API_URL:-http://localhost/api/calendar}
    container_name: calendar_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_CALENDAR_API_URL:-http://localhost/api/calendar}
    depends_on:
      - calendar-backend
    networks:
      intranet:
        ipv4_address: 172.20.0.32
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --quiet --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
  # ------------------------------------------------------------------
  # PLACEHOLDER PARA FUTUROS MICROSERVICIOS
  # ------------------------------------------------------------------
  
